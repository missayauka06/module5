<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Edviser Chatbot</title>
<style>
body {
    font-family: Arial;
    background: #eef2f7;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.chat {
    width: 420px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
}
.messages {
    height: 450px;
    overflow-y: auto;
    padding: 15px;
}
.msg {
    margin: 8px 0;
    padding: 10px;
    border-radius: 8px;
    max-width: 80%;
}
.user { background: #4caf50; color: white; margin-left: auto; }
.bot { background: #ddd; }
.input {
    display: flex;
    border-top: 1px solid #ccc;
}
input {
    flex: 1;
    border: none;
    padding: 10px;
}
button {
    background: #4caf50;
    color: white;
    border: none;
    padding: 10px;
}
.quick {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding: 10px;
}
.quick button {
    background: #eee;
    color: black;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="chat">
    <div class="messages" id="chat"></div>

    <div class="quick">
        <button onclick="ask('gpa қалай көтерем')">GPA</button>
        <button onclick="ask('қай пән оңай')">Пән</button>
        <button onclick="ask('it қалай бастаймын')">IT</button>
        <button onclick="ask('мотивация жоқ')">Мотивация</button>
    </div>

    <div class="input">
        <input id="input" placeholder="Сұрақ жазыңыз...">
        <button onclick="send()">Жіберу</button>
    </div>
</div>

<script>
const answers = {
    "gpa": "GPA көтеру үшін жеңіл пәндер алып, барлық тапсырмаларды уақытында орында.",
    "пән": "Оңай пәндер көбіне теориялық және мұғалімі жұмсақ болады.",
    "it": "IT бастау үшін Python немесе JavaScript үйренуден баста.",
    "мотивация": "Кішкентай мақсат қойып, күн сайын әрекет ет.",
    "резюме": "Резюме қысқа, нақты және тәжірибеге негізделуі керек.",
    "стажировка": "LinkedIn, hh.kz арқылы стажировка ізде.",
    "ux": "UX үшін Figma, research және практика маңызды.",
    "программист": "Күн сайын код жазып, жобалар жаса.",
    "уақыт": "Pomodoro әдісін қолдан: 25 мин оқу, 5 мин демалыс.",
    "емтихан": "Емтиханға алдын ала дайындалып, қайталау жаса.",
};

function add(text, cls){
    let div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function getAnswer(q){
    q = q.toLowerCase();
    for(let key in answers){
        if(q.includes(key)) return answers[key];
    }
    return "Нақтырақ сұрақ қойшы 🙂";
}

function send(){
    let input = document.getElementById('input');
    let text = input.value;
    if(!text) return;

    add(text,'user');
    setTimeout(()=> add(getAnswer(text),'bot'),500);
    input.value='';
}

function ask(text){
    add(text,'user');
    setTimeout(()=> add(getAnswer(text),'bot'),500);
}
</script>

</body>
</html>

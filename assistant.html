<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЖИ Эдвайзер — Онлайн көмекші</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sb-top">
      <div class="sb-logo">
        <div class="mark">ЖИ</div>
        <div>
          <div class="sb-title">ЖИ Эдвайзер</div>
          <div class="sb-sub">Онлайн көмекші</div>
        </div>
      </div>

      <nav class="sb-nav">
        <a href="home.html">🏠 Басты</a>
        <a href="guide.html">📘 Нұсқаулықтар</a>
        <a href="payment-check.html">💳 Төлем тексеру</a>
        <a href="training.html">🧠 Жаттығу</a>
        <a href="strategy.html">🛡️ Стратегия</a>
        <a class="active" href="assistant.html">💬 ЖИ көмекші</a>
        <a href="about.html">ℹ️ Жоба туралы</a>
      </nav>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1>💬 ЖИ Қаржылық Көмекші</h1>
      <p class="muted">
        Қаржылық қауіпсіздік туралы сұрақ қойыңыз.
      </p>
    </header>

    <section class="card" style="height:500px; display:flex; flex-direction:column;">

      <div id="chatBox" style="flex:1; overflow-y:auto; padding:10px;"></div>

      <div class="row">
        <input class="input" id="userInput" placeholder="Сұрағыңызды жазыңыз..." style="flex:1;">
        <button class="btn" id="sendBtn">Жіберу</button>
      </div>

    </section>
  </main>

<script>
const chatBox = document.getElementById("chatBox");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

function addMessage(text, sender){
  const div = document.createElement("div");
  div.style.marginBottom = "10px";
  div.style.padding = "10px";
  div.style.borderRadius = "14px";
  div.style.maxWidth = "80%";

  if(sender === "user"){
    div.style.background = "rgba(43,124,255,0.2)";
    div.style.marginLeft = "auto";
  } else {
    div.style.background = "rgba(34,197,94,0.2)";
  }

  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function getAIResponse(text){
  text = text.toLowerCase();

  if(text.includes("алаяқ") || text.includes("мошенник"))
    return "Егер алаяқтық күдігі болса — жеке деректеріңізді бермеңіз және банкке хабарласыңыз.";

  if(text.includes("cvv") || text.includes("код"))
    return "CVV кодты ешкімге айтуға болмайды. Бұл құпия ақпарат.";

  if(text.includes("сілтеме") || text.includes("link"))
    return "Бейтаныс сілтемелерді баспаңыз. Сайтта https болуы керек.";

  if(text.includes("пароль"))
    return "Құпия сөз кемінде 8 символдан тұрып, әріп пен саннан құралғаны дұрыс.";

  return "Сұрағыңызды нақтырақ жазыңыз. Мен қаржылық қауіпсіздік бойынша көмектесемін.";
}

function sendMessage(){
  const text = userInput.value.trim();
  if(!text) return;

  addMessage(text, "user");

  setTimeout(()=>{
    const reply = getAIResponse(text);
    addMessage(reply, "ai");
  }, 500);

  userInput.value = "";
}

sendBtn.addEventListener("click", sendMessage);
userInput.addEventListener("keydown", e=>{
  if(e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
